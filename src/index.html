<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant | AI</title>
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body>

    <div class="glow-bg"></div>

    <main class="container">
        <header>
            <h1 class="title">Chat Assistant</h1>
            <p class="subtitle">Sua inteligência avançada para 🗓️ Calendário | 🧮 Calculadora | 🌤️ Clima</p>
        </header>

        <section class="main-grid">
            <!-- Lado Esquerdo: Painel de Respostas -->
            <div class="glass-panel display-area">
                <div class="panel-header">
                    <span class="dot"></span>
                    <span class="label">Monitor de Resposta</span>
                </div>
                <div id="output" class="output-content">
                    <p class="placeholder-text" id="output">Aguardando comando...</p>
                </div>
            </div>

            <!-- Lado Direito: Ferramentas e Widgets -->
            <aside class="widgets">
                <!-- Seção Clima -->
                <section class="glass-panel weather-widget">
                    <h3>Previsão do Tempo</h3>
                    <div class="input-group">
                        <select id="city-select">
                            <option value="">Selecione um Estado</option>
                            <option value="Acre">Acre</option>
                            <option value="Alagoas">Alagoas</option>
                            <option value="Amapá">Amapá</option>
                            <option value="Amazonas">Amazonas</option>
                            <option value="Bahia">Bahia</option>
                            <option value="Ceará">Ceará</option>
                            <option value="Distrito Federal">Distrito Federal</option>
                            <option value="Espírito Santo">Espírito Santo</option>
                            <option value="Goiás">Goiás</option>
                            <option value="Maranhão">Maranhão</option>
                            <option value="Mato Grosso">Mato Grosso</option>
                            <option value="Mato Grosso do Sul">Mato Grosso do Sul</option>
                            <option value="Minas Gerais">Minas Gerais</option>
                            <option value="Pará">Pará</option>
                            <option value="Paraíba">Paraíba</option>
                            <option value="Paraná">Paraná</option>
                            <option value="Pernambuco">Pernambuco</option>
                            <option value="Piauí">Piauí</option>
                            <option value="Rio de Janeiro">Rio de Janeiro</option>
                            <option value="Rio Grande do Norte">Rio Grande do Norte</option>
                            <option value="Rio Grande do Sul">Rio Grande do Sul</option>
                            <option value="Rondônia">Rondônia</option>
                            <option value="Roraima">Roraima</option>
                            <option value="Santa Catarina">Santa Catarina</option>
                            <option value="São Paulo">São Paulo</option>
                            <option value="Sergipe">Sergipe</option>
                            <option value="Tocantins">Tocantins</option>

                        </select>
                    </div>
                </section>


            </aside>
        </section>

        <!-- Campo de Input Principal -->
        <footer class="input-container">
            <div class="glass-panel input-wrapper">
                <input type="text" placeholder="Pergunte sobre clima, matemática ou calendário..." id="user-input">
                <button id="send-btn">Enviar</button>
            </div>
        </footer>
    </main>
    <script type="module" src="scripts/main.js"></script>
    <script type="module" src="scripts/listeners.js"></script>
</body>

</html>
